site_name: go-instagram
site_description: Pure-Go best-effort read client for public Instagram content.
site_url: https://go-instagram.github.io/docs/
site_author: go-instagram contributors

repo_name: go-instagram/instagram
repo_url: https://github.com/go-instagram/instagram

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle: { icon: material/brightness-auto, name: Auto }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle: { icon: material/brightness-7, name: Light }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle: { icon: material/brightness-4, name: Dark }

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: { permalink: "#" }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Usage: usage.md
  - API reference: api.md
  - Fragility & ToS: fragility.md
